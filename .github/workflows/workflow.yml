# This is a basic workflow to help you get started with Actions

name: "PR Workflow"

run-name: "Workflow triggered by ${{ github.triggering_actor }}"

env:
  GITHUB_ACTIONS: "Successfully configured GitHub Actions environment variable"
# Controls when the workflow will run
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  github-task-job:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Show GITHUB_ACTIONS env
        run: echo "GITHUB_ACTIONS=${{ env.GITHUB_ACTIONS }}"

      - name: Show branch and repo
        run: |
          echo "Branch: ${{ github.head_ref }}, Repo: ${{ github.repository }}"

      - name: Show event name
        run: |
          echo "Event: ${{ github.event_name }}"
